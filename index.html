<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>거래처 통합 조회</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
                   "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f4f5f7;
      color: #1f2329;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 60px; }
    h1 { font-size: 16px; margin: 6px 0 14px; color: #525866; font-weight: 600; }
    .searchbox {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d6dae0;
      border-radius: 12px;
      font-size: 16px;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
    }
    .searchbox:focus { border-color: #4d7cff; }
    .hint { color: #8a93a3; font-size: 13px; margin-top: 8px; }

    .results { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .result-item {
      background: #fff;
      border: 1px solid #e5e7ec;
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color 0.12s, transform 0.05s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .result-item:hover { border-color: #b8c2d6; }
    .result-item:active { transform: scale(0.99); }
    .result-name { font-size: 15.5px; font-weight: 600; color: #1f2329; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
    }
    .badge.b-bulman    { background: #fff1ed; color: #d94c1d; }
    .badge.b-misu      { background: #fde7ea; color: #c1162e; }
    .badge.b-pc        { background: #e7efff; color: #2658d4; }
    .badge.b-mfp       { background: #efe9ff; color: #6535d4; }
    .badge .num { font-weight: 700; }

    .empty { color: #8a93a3; padding: 24px; text-align: center; font-size: 14px; }
    .loading { color: #8a93a3; padding: 16px; text-align: center; font-size: 14px; }
    .error { color: #c1162e; padding: 16px; background: #fde7ea; border-radius: 10px; font-size: 13px; margin-top: 10px; }

    .back {
      display: inline-flex; align-items: center; gap: 6px;
      color: #4d7cff; font-size: 14px; cursor: pointer;
      padding: 8px 0; user-select: none;
    }
    .vendor-title {
      background: #fff; padding: 18px 18px;
      border: 1px solid #e5e7ec; border-radius: 12px;
      font-size: 19px; font-weight: 700;
      margin-top: 4px;
    }
    .tabs { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
    .tab {
      padding: 7px 12px; border-radius: 999px;
      background: #eaedf2; color: #6d7686;
      font-size: 13px; font-weight: 600;
      cursor: pointer; user-select: none;
      border: 1px solid transparent;
    }
    .tab.active { background: #2658d4; color: #fff; }
    .tab.disabled { opacity: 0.45; cursor: default; }

    .panel { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: #fff; border: 1px solid #e5e7ec; border-radius: 12px;
      padding: 14px 16px;
    }
    .row { display: flex; gap: 10px; padding: 4px 0; font-size: 13.5px; line-height: 1.5; }
    .row .k { min-width: 96px; color: #8a93a3; flex-shrink: 0; }
    .row .v { color: #1f2329; word-break: break-word; flex: 1; }
    .row .v.empty-v { color: #b8c2d6; }
    .sheet-tag {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      background: #f0f3f7; color: #6d7686; font-size: 11px; font-weight: 600;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
<div class="wrap" id="app">
  <div id="screen-search">
    <h1>거래처 통합 조회</h1>
    <input id="searchInput" class="searchbox" type="text" placeholder="업체명을 입력하세요" autocomplete="off" />
    <div id="resultArea"></div>
  </div>

  <div id="screen-detail" style="display:none;">
    <div class="back" onclick="goBack()">← 검색으로</div>
    <div class="vendor-title" id="vendorTitle"></div>
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
// ⚠️ 너의 활성 GAS 웹앱 URL — 그대로 유지 (이미 박혀있던 URL)
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw1fMYxDhQObrtffi7_-RCaEwg5VdvTk7MNnKqCDsbcvDUr84LU-4VPjYeXf4jHaY3q/exec';

const CATEGORIES = ['불만', '미수', 'PC확장성', '복합기확장성'];
const BADGE_CLASS = {
  '불만': 'b-bulman',
  '미수': 'b-misu',
  'PC확장성': 'b-pc',
  '복합기확장성': 'b-mfp'
};

const state = { current: null, activeTab: '불만', jsonpSeq: 0, searchSeq: 0 };

function jsonp(params, timeoutMs) {
  timeoutMs = timeoutMs || 60000;
  return new Promise((resolve, reject) => {
    const cbName = '__jp' + (++state.jsonpSeq) + '_' + Date.now();
    const url = GAS_URL + '?' + new URLSearchParams(Object.assign({callback: cbName}, params)).toString();
    const cleanup = () => {
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timer);
    };
    const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, timeoutMs);
    window[cbName] = (data) => { cleanup(); resolve(data); };
    const script = document.createElement('script');
    script.src = url;
    script.onerror = () => { cleanup(); reject(new Error('network')); };
    document.body.appendChild(script);
  });
}

let searchTimer = null;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  const area = document.getElementById('resultArea');
  if (q.length < 1) { area.innerHTML = '<div class="hint">한 글자 이상 입력하세요</div>'; return; }
  area.innerHTML = '<div class="loading">검색 중…</div>';
  const seq = ++state.searchSeq;
  searchTimer = setTimeout(async () => {
    try {
      const data = await jsonp({action: 'search', q: q});
      if (seq !== state.searchSeq) return;
      renderResults(data);
    } catch (err) {
      if (seq !== state.searchSeq) return;
      area.innerHTML = '<div class="error">검색 실패: ' + err.message + '</div>';
    }
  }, 250);
});

function renderResults(data) {
  const area = document.getElementById('resultArea');
  if (data.error) { area.innerHTML = '<div class="error">' + data.error + '</div>'; return; }
  if (!data.results || data.results.length === 0) {
    area.innerHTML = '<div class="empty">검색 결과 없음</div>';
    return;
  }

  let html = '<div class="results">';
  for (const item of data.results) {
    const counts = item.counts || {};
    let badges = '';
    for (const cat of CATEGORIES) {
      const n = counts[cat] || 0;
      if (n === 0) continue;
      badges += '<span class="badge ' + BADGE_CLASS[cat] + '">' + cat + ' <span class="num">' + n + '</span></span>';
    }
    if (!badges) badges = '<span style="font-size:12px;color:#b8c2d6;">데이터 없음</span>';

    const safeName = escapeAttr(item.vendor);
    html += '<div class="result-item" onclick="selectVendor(\'' + safeName + '\')">';
    html += '<div class="result-name">' + escapeHtml(item.vendor) + '</div>';
    html += '<div class="badges">' + badges + '</div>';
    html += '</div>';
  }
  html += '</div>';
  area.innerHTML = html;
}

async function selectVendor(name) {
  document.getElementById('screen-search').style.display = 'none';
  document.getElementById('screen-detail').style.display = 'block';
  document.getElementById('vendorTitle').textContent = name;
  document.getElementById('tabs').innerHTML = '<div class="loading">불러오는 중…</div>';
  document.getElementById('panel').innerHTML = '';

  try {
    const data = await jsonp({action: 'detail', q: name});
    state.current = data;
    if (data.error) {
      document.getElementById('panel').innerHTML = '<div class="error">' + data.error + '</div>';
      document.getElementById('tabs').innerHTML = '';
      return;
    }
    let firstActive = '불만';
    for (const cat of CATEGORIES) {
      if (data[cat] && data[cat].length > 0) { firstActive = cat; break; }
    }
    state.activeTab = firstActive;
    renderTabs();
    renderPanel();
  } catch (err) {
    document.getElementById('panel').innerHTML = '<div class="error">조회 실패: ' + err.message + '</div>';
    document.getElementById('tabs').innerHTML = '';
  }
}

function renderTabs() {
  const data = state.current;
  let html = '';
  for (const cat of CATEGORIES) {
    const n = (data[cat] || []).length;
    const cls = ['tab'];
    if (cat === state.activeTab) cls.push('active');
    if (n === 0) cls.push('disabled');
    const onclick = n > 0 ? 'onclick="setTab(\'' + cat + '\')"' : '';
    html += '<div class="' + cls.join(' ') + '" ' + onclick + '>' + cat + ' ' + n + '</div>';
  }
  document.getElementById('tabs').innerHTML = html;
}

function setTab(cat) { state.activeTab = cat; renderTabs(); renderPanel(); }

function renderPanel() {
  const items = state.current[state.activeTab] || [];
  const panel = document.getElementById('panel');
  if (items.length === 0) {
    panel.innerHTML = '<div class="empty">' + state.activeTab + ' 데이터 없음</div>';
    return;
  }
  let html = '';
  for (const item of items) {
    html += '<div class="card">';
    if (item._시트) html += '<div class="sheet-tag">' + escapeHtml(item._시트) + '</div>';
    for (const k in item) {
      if (k === '_시트') continue;
      const val = item[k];
      const isEmpty = val === '' || val === null || val === undefined;
      html += '<div class="row"><div class="k">' + escapeHtml(k) + '</div>';
      html += '<div class="v ' + (isEmpty ? 'empty-v' : '') + '">' + (isEmpty ? '-' : escapeHtml(String(val))) + '</div></div>';
    }
    html += '</div>';
  }
  panel.innerHTML = html;
}

function goBack() {
  document.getElementById('screen-detail').style.display = 'none';
  document.getElementById('screen-search').style.display = 'block';
  document.getElementById('searchInput').focus();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}
</script>
</body>
</html>
